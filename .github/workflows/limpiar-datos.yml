name: Limpiar datos de prueba (una sola vez)
# Borra TODOS los pedidos y el menú, las fotos y los ingredientes guardados (la tienda vuelve a los datos originales).
# NO toca los usuarios del panel (colección admins) ni las cuentas de Authentication.
# Es irreversible: solo corre a mano y pide escribir la confirmación.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe BORRAR PEDIDOS para continuar'
        required: true
concurrency:
  group: limpiar-datos
jobs:
  limpiar:
    if: ${{ inputs.confirmar == 'BORRAR PEDIDOS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROYECTO: anonimus-pizza
      API: https://firestore.googleapis.com/v1/projects/anonimus-pizza/databases/(default)/documents
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Contar antes
        run: |
          contar() { curl -fsS -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" "$API/$1?pageSize=300&mask.fieldPaths=nombre" | jq -r '"\(.documents // [] | length)\(if .nextPageToken then "+" else "" end)"'; }
          echo "pedidos: $(contar pedidos)"; echo "config: $(contar config)"; echo "admins (se conservan): $(contar admins)"
      - name: Permisos de la cuenta de servicio
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" -H "Content-Type: application/json" \
            -d '{"permissions":["datastore.databases.get","datastore.entities.list","datastore.entities.delete"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$PROYECTO:testIamPermissions"
      - name: Borrar pedidos, menú, fotos e ingredientes guardados
        run: |
          T="${{ steps.auth.outputs.access_token }}"
          borrar_coleccion() { # borra todos los documentos de una colección (por REST, mostrando el error si lo hay)
            while true; do
              NOMBRES=$(curl -fsS -H "Authorization: Bearer $T" "$API/$1?pageSize=100&mask.fieldPaths=nombre" | jq -r '.documents // [] | .[].name')
              [ -z "$NOMBRES" ] && break
              for N in $NOMBRES; do
                curl -sS --fail-with-body -X DELETE -H "Authorization: Bearer $T" "https://firestore.googleapis.com/v1/$N" > /dev/null && echo "borrado: ${N##*/documents/}" || { echo "NO se pudo borrar ${N##*/documents/}"; exit 1; }
              done
            done
          }
          borrar_coleccion pedidos
          for d in menu fotos ingredientes; do
            curl -sS -o /dev/null -w "config/$d -> HTTP %{http_code}\n" -X DELETE -H "Authorization: Bearer $T" "$API/config/$d"
          done
      - name: Verificar que quedó limpio
        run: |
          contar() { curl -fsS -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" "$API/$1?pageSize=300&mask.fieldPaths=nombre" | jq -r '"\(.documents // [] | length)\(if .nextPageToken then "+" else "" end)"'; }
          P=$(contar pedidos); C=$(contar config); A=$(contar admins)
          echo "pedidos: $P · config: $C · admins (se conservan): $A"
          test "$P" = "0" && test "$C" = "0"
          test "$A" != "0"
